# ============================================================
#  SkyBlock challenges
#
#  categories:
#    <id>:
#      name:           weergavenaam (& kleurcodes)
#      icon:           materiaal voor het tabblad
#      required-level: eilandlevel dat nodig is om de categorie te ontgrendelen
#      description:    (optioneel) extra regels in de lore
#
#  challenges:
#    <id>:
#      category:    id van een categorie hierboven
#      name:        weergavenaam
#      icon:        materiaal van het icoon
#      description: lijst met regels
#      type:        INVENTORY | ISLAND_LEVEL | ISLAND_BLOCKS
#      required:    MATERIAAL: aantal   (INVENTORY: items, ISLAND_BLOCKS: blokken)
#      take:        true/false (INVENTORY: items inleveren, standaard true)
#      level:       vereist eilandlevel (ISLAND_LEVEL)
#      radius:      zoekstraal rond de speler (ISLAND_BLOCKS, standaard 10)
#      reward:      money, xp, items (MATERIAAL: aantal), commands (lijst, {player})
#      repeatable:  true/false
#      repeat-reward: (optioneel) beloning bij herhalen, zelfde opbouw als reward
#      max-completions: (optioneel) maximaal aantal keer, 0 = onbeperkt
# ============================================================

