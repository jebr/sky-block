# ============================================================
#  SkyBlock shop
#
#  Per categorie:
#    name:        weergavenaam (& kleurcodes)
#    icon:        materiaal van het icoon
#    slot:        (optioneel) vakje in het shopmenu (10-34, niet in de rand)
#    description: (optioneel) extra regels in de lore
#    items:       lijst van artikelen
#
#  Per artikel (de sleutel is een vrije id; zonder 'material' wordt de sleutel
#  als materiaal gebruikt):
#    material: materiaalnaam (1.21)
#    amount:   aantal stuks per eenheid (1-64)
#    buy:      koopprijs per eenheid  (0 of -1 = niet te koop)
#    sell:     verkoopprijs per eenheid (0 of -1 = niet te verkopen)
#
#  Richtlijn: verkopen levert ongeveer 1/4 tot 1/3 van de koopprijs op.
#  De upgrades kosten 2.000 tot 50.000, dus een uur actief farmen moet
#  enkele honderden tot een paar duizend opleveren.
# ============================================================

